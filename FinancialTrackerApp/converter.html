<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter - Githua Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="cash.ico" type="image/x-icon">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-slate-950">
    
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-black text-xl shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-money-bill-transfer"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">Githua Tracker <span class="text-xs px-2 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full ml-2">Converter</span></h1>
                <p class="text-xs text-slate-400">Live USD to KES Exchange Utility</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <a href="index.html" class="flex items-center space-x-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
                <i class="fa-solid fa-arrow-left text-emerald-400"></i>
                <span>Dashboard</span>
            </a>
            <a href="analysis.html" class="flex items-center space-x-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
                <i class="fa-solid fa-chart-pie text-emerald-400"></i>
                <span>Analysis</span>
            </a>
            <button onclick="requestAppClose()" class="text-xs bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg transition font-bold shadow-md flex items-center space-x-1">
                <i class="fa-solid fa-power-off"></i>
                <span>Exit</span>
            </button>
        </div>
    </header>
    

    <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 flex items-center justify-center">
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl w-full">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center">
                <i class="fa-solid fa-money-bill-transfer text-emerald-400 mr-2"></i> USD to KES Live Converter
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Exchange Rate (1 USD to KES)</label>
                    <input type="number" id="exchangeRate" value="130.0" step="0.5" oninput="convertCurrency()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Amount in USD ($)</label>
                    <input type="number" id="usdInput" value="100" step="1" oninput="convertCurrency()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                    <div class="text-xs text-slate-400 mb-1">Equivalent in Kenyan Shillings:</div>
                    <div id="kesOutput" class="text-2xl font-bold text-emerald-400 font-mono">KES 13,000.00</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Smart Exit Notification Modal -->
    <div id="exitModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto text-xl border border-emerald-500/20">
                <i class="fa-solid fa-circle-question text-emerald-400"></i>
            </div>
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Confirm Exit</h3>
            <p class="text-xs text-slate-400">Do you want to close Githua Tracker?</p>
            <div class="flex space-x-2 pt-2">
                <button onclick="confirmExit()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-xl text-xs transition">Yes, Close</button>
                <button onclick="closeExitModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let isElectron = false;
        let ipcRenderer = null;
        try {
            const electron = require('electron');
            ipcRenderer = electron.ipcRenderer;
            isElectron = true;
        } catch (e) {}

        function convertCurrency() {
            const rate = parseFloat(document.getElementById('exchangeRate').value) || 130;
            const usd = parseFloat(document.getElementById('usdInput').value) || 0;
            const kes = usd * rate;
            document.getElementById('kesOutput').innerText = 'KES ' + kes.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function requestAppClose() { document.getElementById('exitModal').classList.remove('hidden'); }
        function closeExitModal() { document.getElementById('exitModal').classList.add('hidden'); }
        function confirmExit() {
            if (isElectron && ipcRenderer) {
                ipcRenderer.send('app-quit');
            } else {
                window.close();
            }
        }
    </script>
</body>
</html>
